AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated, SSM-only WARP blue/green validation lab. No production routing resources.

Parameters:
  LabId:
    Type: String
    AllowedPattern: '[a-z0-9-]{3,32}'
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  ExpiresAt:
    Type: String
    Description: Human-readable teardown deadline in ISO-8601 format.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub evn-warp-blue-green-lab-${LabId}
      EmptyOnDelete: true
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Remove untagged lab images after one day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - Key: Owner
          Value: OziinG
        - Key: Environment
          Value: isolated-lab
        - Key: ExpiresAt
          Value: !Ref ExpiresAt

  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: RemoveLabSource
            Status: Enabled
            ExpirationInDays: 1
      Tags:
        - Key: Owner
          Value: OziinG
        - Key: Environment
          Value: isolated-lab
        - Key: ExpiresAt
          Value: !Ref ExpiresAt

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildLabImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/warp-bg-lab-${LabId}:*
              - Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource: !GetAtt SourceBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${SourceBucket.Arn}/source.zip
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ImageRepository.Arn
      Tags:
        - Key: Owner
          Value: OziinG
        - Key: Environment
          Value: isolated-lab

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/warp-bg-lab-${LabId}
      RetentionInDays: 1
      Tags:
        - Key: Owner
          Value: OziinG
        - Key: Environment
          Value: isolated-lab
        - Key: ExpiresAt
          Value: !Ref ExpiresAt

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub warp-bg-lab-${LabId}
      Description: Builds five WARP lab images outside the serving instance.
      ServiceRole: !GetAtt BuildRole.Arn
      Source:
        Type: S3
        Location: !Sub ${SourceBucket}/source.zip
        BuildSpec: deploy/blue-green-lab/buildspec.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:8.0
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !GetAtt ImageRepository.RepositoryUri
          - Name: SOURCE_REVISION
            Value: unset
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
      TimeoutInMinutes: 30
      QueuedTimeoutInMinutes: 10
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      Tags:
        - Key: Owner
          Value: OziinG
        - Key: Environment
          Value: isolated-lab
        - Key: ExpiresAt
          Value: !Ref ExpiresAt

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PullLabImagesOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ImageRepository.Arn
      Tags:
        - Key: Owner
          Value: OziinG
        - Key: Environment
          Value: isolated-lab

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: WARP blue-green lab - no inbound, HTTPS outbound only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: AWS APIs, ECR layers and package/image registries
      Tags:
        - Key: Name
          Value: !Sub warp-bg-lab-${LabId}
        - Key: Owner
          Value: OziinG
        - Key: Environment
          Value: isolated-lab
        - Key: ExpiresAt
          Value: !Ref ExpiresAt

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet: [!Ref SecurityGroup]
          SubnetId: !Ref SubnetId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: disabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 24
            VolumeType: gp3
      InstanceInitiatedShutdownBehavior: terminate
      Monitoring: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker gzip openssl python3 tar
          install -d -m 0755 /etc/docker /opt/warp-bg-lab
          install -d -m 0777 /var/lib/warp-bg-lab
          printf '%s\n' '{"log-driver":"local","log-opts":{"max-size":"10m","max-file":"3"}}' > /etc/docker/daemon.json
          systemctl enable --now docker
          systemctl enable --now amazon-ssm-agent
          printf '%s\n' '${AWS::StackName}' > /opt/warp-bg-lab/stack-name
      Tags:
        - Key: Name
          Value: !Sub warp-bg-lab-${LabId}
        - Key: Owner
          Value: OziinG
        - Key: Environment
          Value: isolated-lab
        - Key: ProductionImpact
          Value: none
        - Key: ExpiresAt
          Value: !Ref ExpiresAt

Outputs:
  InstanceId:
    Value: !Ref Instance
  RepositoryName:
    Value: !Ref ImageRepository
  RepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
  SourceBucketName:
    Value: !Ref SourceBucket
  BuildProjectName:
    Value: !Ref BuildProject
  SecurityGroupId:
    Value: !Ref SecurityGroup
