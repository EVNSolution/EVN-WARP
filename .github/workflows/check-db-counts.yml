name: Check DB Counts on EC2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Count rows
        id: ssm
        run: |
          cat > /tmp/check.json << 'EOF'
          {"commands": [
            "cd /opt/evn-warp",
            "node -e \"const {createClient}=require('@libsql/client');const c=createClient({url:'file:./dev.db'});const origParentId='cmqg0lt0g0000ak1jke7t2rth';const origSubSeq=13;const taskId='cms8c40re00032xnrji92lfxj';c.execute({sql:'SELECT id, title, parentId, subSeq FROM StrategyTask WHERE id = ?', args:[taskId]}).then(before=>{console.log('BEFORE:', JSON.stringify(before.rows[0]));return c.execute({sql:'UPDATE StrategyTask SET parentId = ?, subSeq = ? WHERE id = ?', args:[origParentId, origSubSeq, taskId]});}).then(()=>c.execute({sql:'SELECT id, title, parentId, subSeq FROM StrategyTask WHERE id = ?', args:[taskId]})).then(after=>{console.log('AFTER:', JSON.stringify(after.rows[0]));}).catch(e=>console.error('ERR', e.message));\""
          ]}
          EOF

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "EVN-WARP DB count check" \
            --timeout-seconds 60 \
            --parameters file:///tmp/check.json \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Command: $command_id"

      - name: Get result
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          for i in $(seq 1 15); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            echo "[$i] $status"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text || true
