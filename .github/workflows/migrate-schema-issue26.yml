name: Migrate Schema (Issue 26) - temporary

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Backup then push schema (Issue #26)
        id: ssm
        run: |
          cat > /tmp/migrate.json << 'EOF'
          {"commands": [
            "set -eu",
            "TS=$(date +%Y%m%d-%H%M%S)",
            "BACKUP=/opt/evn-warp-runtime/backups/dev-$TS-pre-issue26-manual.db",
            "cp --reflink=auto /opt/evn-warp-runtime/database/dev.db $BACKUP",
            "echo backup_created=$BACKUP",
            "ls -la $BACKUP",
            "cd /opt/evn-warp",
            "git rev-parse HEAD",
            "npx prisma generate",
            "npx prisma db push --accept-data-loss",
            "echo '--- post-migration health check ---'",
            "curl -sfI http://127.0.0.1:3000/login | head -3"
          ]}
          EOF

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "EVN-WARP Issue #26 schema migration" \
            --timeout-seconds 120 \
            --parameters file:///tmp/migrate.json \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Command: $command_id"

      - name: Get result
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          for i in $(seq 1 20); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            echo "[$i] $status"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          final_status="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text 2>/dev/null || echo Unknown)"
          test "$final_status" = "Success"
