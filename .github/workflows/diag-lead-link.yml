name: Diagnose lead-customer linking - temporary

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Query customer/deal linkage
        id: ssm
        run: |
          cat > /tmp/query.json << 'EOF'
          {"commands": [
            "cd /opt/evn-warp",
            "node -e \"const {createClient}=require('@libsql/client');const c=createClient({url:'file:/opt/evn-warp-runtime/database/dev.db'});const id='cmsodswnr00060pnr0c4hj624';(async()=>{const cu=await c.execute('SELECT id, name, phone, createdAt, updatedAt FROM \\\"Customer\\\" WHERE id = ?', [id]);console.log('linkedCustomer:', JSON.stringify(cu.rows));})().catch(e=>console.error(e));\""
          ]}
          EOF

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "EVN-WARP diagnose lead-customer link" \
            --timeout-seconds 60 \
            --parameters file:///tmp/query.json \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Get result
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          for i in $(seq 1 15); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            echo "[$i] $status"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 4
          done
          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text || true
